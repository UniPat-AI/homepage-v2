name: Branch previews
run-name: Preview ${{ github.event.workflow_run.head_branch || github.event.ref }}

on:
  workflow_run:
    workflows: [Check and deploy official website]
    types: [completed]
  delete:

permissions:
  contents: read

jobs:
  preview:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch != 'main' &&
      github.event.workflow_run.head_repository.id == github.event.repository.id) ||
      (github.event_name == 'delete' && github.event.ref_type == 'branch' && github.event.ref != 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: preview
      url: ${{ steps.preview.outputs.url }}
    env:
      PREVIEW_DOMAIN: ${{ vars.PREVIEW_DOMAIN }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id || github.run_id }}
      SOURCE_ATTEMPT: ${{ github.event.workflow_run.run_attempt || github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Identify preview
        id: preview
        run: python deploy/preview/client.py
      - name: Verify the branch still points to this checked commit
        id: current
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.error, urllib.parse, urllib.request
          from pathlib import Path
          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          branch = event['workflow_run']['head_branch']
          url = os.environ['GITHUB_API_URL'] + '/repos/' + os.environ['GITHUB_REPOSITORY'] + '/git/ref/heads/' + urllib.parse.quote(branch, safe='')
          request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          try:
              with urllib.request.urlopen(request) as response:
                  current = json.load(response)['object']['sha'] == os.environ['SOURCE_SHA']
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              current = False
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('deploy=' + str(current).lower() + '\n')
          PY
      - name: Checkout checked source without executing branch scripts
        if: steps.current.outputs.deploy == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: preview-source
          persist-credentials: false
      - name: Configure preview SSH
        if: steps.current.outputs.deploy == 'true' || github.event_name == 'delete'
        env:
          SSH_KEY: ${{ secrets.PREVIEW_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PREVIEW_KNOWN_HOSTS }}
          PREVIEW_HOST: ${{ vars.PREVIEW_HOST }}
          PREVIEW_USER: ${{ vars.PREVIEW_USER }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/preview_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/preview_known_hosts"
          cat > "$HOME/.ssh/config" <<EOF
          Host unipat-preview
            HostName $PREVIEW_HOST
            User $PREVIEW_USER
            IdentityFile ~/.ssh/preview_key
            UserKnownHostsFile ~/.ssh/preview_known_hosts
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            BatchMode yes
            ConnectTimeout 15
            ServerAliveInterval 15
            ServerAliveCountMax 8
          EOF
      - name: Package and deploy this branch
        if: steps.current.outputs.deploy == 'true'
        env:
          BRANCH_TOKEN: ${{ steps.preview.outputs.branch_token }}
          PREVIEW_KEY: ${{ steps.preview.outputs.key }}
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: |
          set -euo pipefail
          archive="$PREVIEW_KEY-${SOURCE_SHA:0:12}-$SOURCE_RUN_ID-$SOURCE_ATTEMPT.tar.gz"
          python deploy/bundle.py --source preview-source --commit "$SOURCE_SHA" --output "$RUNNER_TEMP/$archive"
          scp "$RUNNER_TEMP/$archive" "unipat-preview:/opt/unipat-previews/incoming/$archive"
          python -c 'import json,os; print(json.dumps(dict(action="deploy",branch=os.environ["BRANCH_TOKEN"],commit=os.environ["SOURCE_SHA"],run_id=os.environ["SOURCE_RUN_ID"],attempt=os.environ["SOURCE_ATTEMPT"])))' | ssh unipat-preview preview
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "$PREVIEW_URL/_health" > "$RUNNER_TEMP/preview-health.json"
          python -c 'import json, os; assert json.load(open(os.environ["RUNNER_TEMP"] + "/preview-health.json"))["release"] == os.environ["SOURCE_SHA"]'
          printf '### Branch preview\n- Preview: %s\n- Commit: `%s`\n' "$PREVIEW_URL" "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove deleted branch preview
        if: github.event_name == 'delete'
        env:
          BRANCH_TOKEN: ${{ steps.preview.outputs.branch_token }}
        run: |
          set -euo pipefail
          python -c 'import json,os; print(json.dumps(dict(action="remove",branch=os.environ["BRANCH_TOKEN"],run_id=os.environ["GITHUB_RUN_ID"],attempt=os.environ["GITHUB_RUN_ATTEMPT"])))' | ssh unipat-preview preview
      - name: Remove local credentials
        if: always()
        run: rm -f "$HOME/.ssh/preview_key" "$HOME/.ssh/preview_known_hosts"
